<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .navbar-custom {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #667eea;
            padding: 15px 20px;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-info {
            color: white;
            font-size: 13px;
        }

        .admin-info strong {
            display: block;
            font-size: 14px;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 13px;
        }

        .btn-logout:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .container-fluid {
            max-width: 1400px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #667eea;
            margin: 15px 0;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-icon {
            font-size: 32px;
            color: #667eea;
            opacity: 0.7;
        }

        .section-title {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin: 40px 0 20px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title i {
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 8px;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            overflow-x: auto;
        }

        table {
            margin: 0;
        }

        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            padding: 15px;
            border: none;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f8f9ff;
        }

        .btn-view {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-view:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .modal-custom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-custom.active {
            display: flex;
        }

        .modal-content-custom {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .modal-header-custom h2 {
            margin: 0;
            color: #333;
            font-size: 24px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: #333;
        }

        .info-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .info-label {
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            color: #333;
            font-size: 16px;
        }

        .items-list {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 600;
            color: #333;
        }

        .item-qty {
            color: #999;
            font-size: 14px;
        }

        .item-price {
            font-weight: 700;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .search-box button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .search-box button:hover {
            transform: scale(1.05);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 20px;
            }

            .table-container {
                padding: 15px;
            }

            th, td {
                padding: 10px;
                font-size: 12px;
            }

            .modal-content-custom {
                width: 95%;
                padding: 20px;
            }

            .navbar-right {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar-custom">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="navbar-brand">
                <i class="fas fa-shield-alt"></i> Admin Dashboard
            </span>
            <div class="navbar-right">
                <div class="admin-info">
                    <span>Welcome, <strong id="adminName">Admin</strong></span>
                </div>
                <button onclick="logout()" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid" style="padding-top: 30px; padding-bottom: 30px;">
        <div class="stats-row" id="statsContainer"></div>

        <div class="section-title">
            <i class="fas fa-shopping-bag"></i>
            All Customer Orders
        </div>
        <div class="table-container">
            <div class="search-box">
                <input type="text" id="orderSearch" placeholder="Search by customer name or email...">
                <button onclick="searchOrders()">Search</button>
            </div>
            <div id="ordersLoading" class="loading">
                <div class="spinner"></div>
                <p>Loading orders...</p>
            </div>
            <table id="ordersTable" style="display: none; width: 100%;">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Email</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="ordersBody"></tbody>
            </table>
        </div>

        <div class="section-title">
            <i class="fas fa-users"></i>
            All Customers
        </div>
        <div class="table-container">
            <div class="search-box">
                <input type="text" id="customerSearch" placeholder="Search by name or email...">
                <button onclick="searchCustomers()">Search</button>
            </div>
            <div id="customersLoading" class="loading">
                <div class="spinner"></div>
                <p>Loading customers...</p>
            </div>
            <table id="customersTable" style="display: none; width: 100%;">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Orders</th>
                        <th>Total Spent</th>
                        <th>Joined</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="customersBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-custom" id="orderModal">
        <div class="modal-content-custom">
            <div class="modal-header-custom">
                <h2>Order Details</h2>
                <button class="close-modal" onclick="closeOrderModal()">×</button>
            </div>
            <div id="orderDetails"></div>
        </div>
    </div>

    <div class="modal-custom" id="customerModal">
        <div class="modal-content-custom">
            <div class="modal-header-custom">
                <h2>Customer Details</h2>
                <button class="close-modal" onclick="closeCustomerModal()">×</button>
            </div>
            <div id="customerDetails"></div>
        </div>
    </div>

    <script>
        let API_BASE = null;
        let token = localStorage.getItem('adminToken');
        let frontendOnly = true; // admin-portal always uses frontend-only mode

        // Try to detect a working backend origin to avoid Live Server returning 405
        async function resolveApiBase() {
            const candidates = [
                window.location.origin,
                'http://localhost:3001',
                'http://localhost:5500'
            ];

            for (const origin of candidates) {
                try {
                    const res = await fetch(`${origin}/api`, {
                        method: 'OPTIONS',
                        mode: 'cors'
                    });
                    // If the backend handles OPTIONS (CORS middleware), it's likely our API
                    if (res.status === 204 || res.status === 200 || res.status === 201 || res.ok) {
                        return `${origin}/api`;
                    }
                } catch (e) {
                    // network error — try next candidate
                }
            }

            // fallback to current origin
            return `${window.location.origin}/api`;
        }
        // Mock data for frontend-only mode
        const mockOrders = [
            { _id: 'local_ord_1', user_id: { name: 'Alice', email: 'alice@example.com', _id: 'u1' }, total: 149.99, status: 'completed', created_at: new Date().toISOString(), items: [{ product_id: { name: 'Wireless Headphones' }, quantity: 1, price: 149.99 }] },
            { _id: 'local_ord_2', user_id: { name: 'Bob', email: 'bob@example.com', _id: 'u2' }, total: 59.99, status: 'pending', created_at: new Date().toISOString(), items: [{ product_id: { name: 'Yoga Mat' }, quantity: 1, price: 59.99 }] }
        ];

        const mockCustomers = [
            { _id: 'u1', name: 'Alice', email: 'alice@example.com', orderCount: 1, totalSpent: 149.99, created_at: new Date().toISOString(), orders: [mockOrders[0]] },
            { _id: 'u2', name: 'Bob', email: 'bob@example.com', orderCount: 1, totalSpent: 59.99, created_at: new Date().toISOString(), orders: [mockOrders[1]] }
        ];

        let allOrders = [];
        let allCustomers = [];

        // Check authentication
        if (!token) {
            window.location.href = 'login.html';
        }

        // Display admin name
        const adminUser = localStorage.getItem('adminUser');
        if (adminUser) {
            const user = JSON.parse(adminUser);
            document.getElementById('adminName').textContent = user.name;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Show notice that we're in frontend-only mode
            const notice = document.createElement('div');
            notice.style.padding = '10px 20px';
            notice.style.background = '#fff3cd';
            notice.style.color = '#856404';
            notice.style.textAlign = 'center';
            notice.style.fontWeight = '700';
            notice.textContent = 'Running in frontend-only mode. Data is mock/local only.';
            document.body.insertBefore(notice, document.body.children[1]);

            // Load mock data
            allOrders = mockOrders.slice();
            allCustomers = mockCustomers.slice();
            displayOrders(allOrders);
            displayCustomers(allCustomers);
            
            // Compute stats from mockOrders
            const uniqueUserIds = new Set(mockOrders.map(o => o.user_id._id));
            const totalRevenue = mockOrders.reduce((s, o) => s + (o.total || 0), 0);
            const pendingCount = mockOrders.filter(o => o.status === 'pending').length;
            const stats = { totalOrders: mockOrders.length, totalRevenue, pendingOrders: pendingCount, totalCustomers: uniqueUserIds.size };
            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-card">
                    <i class="stat-icon fas fa-shopping-bag"></i>
                    <div class="stat-value">${stats.totalOrders}</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                <div class="stat-card">
                    <i class="stat-icon fas fa-dollar-sign"></i>
                    <div class="stat-value">$${stats.totalRevenue.toFixed(2)}</div>
                    <div class="stat-label">Total Revenue</div>
                </div>
                <div class="stat-card">
                    <i class="stat-icon fas fa-hourglass-half"></i>
                    <div class="stat-value">${stats.pendingOrders}</div>
                    <div class="stat-label">Pending Orders</div>
                </div>
                <div class="stat-card">
                    <i class="stat-icon fas fa-users"></i>
                    <div class="stat-value">${stats.totalCustomers}</div>
                    <div class="stat-label">Total Customers</div>
                </div>
            `;
        });

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/admin/orders`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error(`Error: ${response.status}`);
                const orders = await response.json();

                const uniqueUserIds = new Set();
                let totalRevenue = 0;
                let pendingCount = 0;

                orders.forEach(order => {
                  if (order.user_id && typeof order.user_id === 'object') {
                    uniqueUserIds.add(order.user_id._id || order.user_id);
                  }
                  totalRevenue += order.total || 0;
                  if (order.status === 'pending') pendingCount++;
                });

                const stats = {
                    totalOrders: orders.length,
                    totalRevenue: totalRevenue,
                    pendingOrders: pendingCount,
                    totalCustomers: uniqueUserIds.size
                };

                document.getElementById('statsContainer').innerHTML = `
                    <div class="stat-card">
                        <i class="stat-icon fas fa-shopping-bag"></i>
                        <div class="stat-value">${stats.totalOrders}</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    <div class="stat-card">
                        <i class="stat-icon fas fa-dollar-sign"></i>
                        <div class="stat-value">$${stats.totalRevenue.toFixed(2)}</div>
                        <div class="stat-label">Total Revenue</div>
                    </div>
                    <div class="stat-card">
                        <i class="stat-icon fas fa-hourglass-half"></i>
                        <div class="stat-value">${stats.pendingOrders}</div>
                        <div class="stat-label">Pending Orders</div>
                    </div>
                    <div class="stat-card">
                        <i class="stat-icon fas fa-users"></i>
                        <div class="stat-value">${stats.totalCustomers}</div>
                        <div class="stat-label">Total Customers</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('statsContainer').innerHTML = '<p style="color: red; padding: 20px;">Error loading statistics</p>';
            }
        }

        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE}/admin/orders`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                allOrders = await response.json();
                displayOrders(allOrders);
            } catch (error) {
                console.error('Error loading orders:', error);
                const loading = document.getElementById('ordersLoading');
                loading.innerHTML = `<p style="color: red; padding: 20px;"><strong>Error loading orders:</strong> ${error.message}</p>`;
            }
        }

        function displayOrders(orders) {
            const tbody = document.getElementById('ordersBody');
            const table = document.getElementById('ordersTable');
            const loading = document.getElementById('ordersLoading');

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="no-data">No orders found</td></tr>';
            } else {
                tbody.innerHTML = orders.map(order => `
                    <tr>
                        <td><strong>${order._id.substring(0, 8)}...</strong></td>
                        <td>${order.user_id?.name || 'N/A'}</td>
                        <td>${order.user_id?.email || 'N/A'}</td>
                        <td><strong>$${(order.total || 0).toFixed(2)}</strong></td>
                        <td>
                            <span class="status-badge status-${order.status}">${order.status || 'pending'}</span>
                        </td>
                        <td>${new Date(order.created_at).toLocaleDateString()}</td>
                        <td><button class="btn-view" onclick="viewOrder('${order._id}')"><i class="fas fa-eye"></i> View</button></td>
                    </tr>
                `).join('');
            }

            loading.style.display = 'none';
            table.style.display = 'table';
        }

        async function viewOrder(orderId) {
            try {
                let order;
                if (frontendOnly) {
                    order = allOrders.find(o => o._id === orderId);
                    if (!order) {
                        alert('Order not found (local)');
                        return;
                    }
                } else {
                    const response = await fetch(`${API_BASE}/admin/orders/${orderId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!response.ok) throw new Error(`Error: ${response.status}`);
                    order = await response.json();
                }

                const itemsHTML = (order.items && order.items.length > 0)
                    ? order.items.map(item => `
                        <div class="item">
                            <div>
                                <div class="item-name">${item.product_id?.name || 'Product'}</div>
                                <div class="item-qty">Qty: ${item.quantity}</div>
                            </div>
                            <div class="item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                        </div>
                    `).join('')
                    : '<p>No items found</p>';

                document.getElementById('orderDetails').innerHTML = `
                    <div class="info-item">
                        <div class="info-label">Order ID</div>
                        <div class="info-value">${order._id}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Customer Name</div>
                        <div class="info-value">${order.user_id?.name || 'N/A'}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Email</div>
                        <div class="info-value">${order.user_id?.email || 'N/A'}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Shipping Address</div>
                        <div class="info-value">${order.shipping_address || 'N/A'}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Status</div>
                        <div class="info-value"><span class="status-badge status-${order.status}">${order.status || 'pending'}</span></div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Order Date</div>
                        <div class="info-value">${new Date(order.created_at).toLocaleString()}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Items Ordered</div>
                        <div class="items-list">${itemsHTML}</div>
                    </div>
                    <div class="info-item" style="border: none;">
                        <div class="info-label">Total Amount</div>
                        <div class="info-value" style="font-size: 24px;">$${(order.total || 0).toFixed(2)}</div>
                    </div>
                `;

                document.getElementById('orderModal').classList.add('active');
            } catch (error) {
                console.error('Error loading order:', error);
                alert('Error loading order details');
            }
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        async function loadCustomers() {
            try {
                const response = await fetch(`${API_BASE}/admin/customers`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                allCustomers = await response.json();
                displayCustomers(allCustomers);
            } catch (error) {
                console.error('Error loading customers:', error);
                const loading = document.getElementById('customersLoading');
                loading.innerHTML = `<p style="color: red; padding: 20px;"><strong>Error loading customers:</strong> ${error.message}</p>`;
            }
        }

        function displayCustomers(customers) {
            const tbody = document.getElementById('customersBody');
            const table = document.getElementById('customersTable');
            const loading = document.getElementById('customersLoading');

            if (customers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">No customers found</td></tr>';
            } else {
                tbody.innerHTML = customers.map(customer => `
                    <tr>
                        <td><strong>${customer.name}</strong></td>
                        <td>${customer.email}</td>
                        <td><strong>${customer.orderCount || 0}</strong></td>
                        <td><strong>$${(customer.totalSpent || 0).toFixed(2)}</strong></td>
                        <td>${new Date(customer.created_at).toLocaleDateString()}</td>
                        <td><button class="btn-view" onclick="viewCustomer('${customer._id}')"><i class="fas fa-eye"></i> View</button></td>
                    </tr>
                `).join('');
            }

            loading.style.display = 'none';
            table.style.display = 'table';
        }

        async function viewCustomer(customerId) {
            try {
                let customer;
                if (frontendOnly) {
                    customer = allCustomers.find(c => c._id === customerId);
                    if (!customer) { alert('Customer not found (local)'); return; }
                } else {
                    const response = await fetch(`${API_BASE}/admin/customers/${customerId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!response.ok) throw new Error(`Error: ${response.status}`);
                    customer = await response.json();
                }

                const ordersHTML = (customer.orders && customer.orders.length > 0)
                    ? customer.orders.map(order => `
                        <div class="item">
                            <div>
                                <div class="item-name">Order ${order._id.substring(0, 8)}</div>
                                <div class="item-qty">${new Date(order.created_at).toLocaleDateString()}</div>
                            </div>
                            <div class="item-price">$${(order.total || 0).toFixed(2)}</div>
                        </div>
                    `).join('')
                    : '<p>No orders</p>';

                const totalSpent = customer.orders ? customer.orders.reduce((sum, o) => sum + (o.total || 0), 0) : 0;

                document.getElementById('customerDetails').innerHTML = `
                    <div class="info-item">
                        <div class="info-label">Name</div>
                        <div class="info-value">${customer.name}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Email</div>
                        <div class="info-value">${customer.email}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Member Since</div>
                        <div class="info-value">${new Date(customer.created_at).toLocaleDateString()}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Total Orders</div>
                        <div class="info-value">${customer.orders ? customer.orders.length : 0}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Total Spent</div>
                        <div class="info-value" style="font-size: 20px; color: #667eea;">$${totalSpent.toFixed(2)}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Order History</div>
                        <div class="items-list">${ordersHTML}</div>
                    </div>
                `;

                document.getElementById('customerModal').classList.add('active');
            } catch (error) {
                console.error('Error loading customer:', error);
                alert('Error loading customer details');
            }
        }

        function closeCustomerModal() {
            document.getElementById('customerModal').classList.remove('active');
        }

        function searchOrders() {
            const query = document.getElementById('orderSearch').value.toLowerCase();
            const filtered = allOrders.filter(order =>
                (order.user_id?.name || '').toLowerCase().includes(query) ||
                (order.user_id?.email || '').toLowerCase().includes(query)
            );
            displayOrders(filtered);
        }

        function searchCustomers() {
            const query = document.getElementById('customerSearch').value.toLowerCase();
            const filtered = allCustomers.filter(customer =>
                customer.name.toLowerCase().includes(query) ||
                customer.email.toLowerCase().includes(query)
            );
            displayCustomers(filtered);
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            localStorage.removeItem('frontendOnly');
            window.location.href = 'login.html';
        }

        // Close modals when clicking outside
        document.getElementById('orderModal')?.addEventListener('click', (e) => {
            if (e.target.id === 'orderModal') closeOrderModal();
        });

        document.getElementById('customerModal')?.addEventListener('click', (e) => {
            if (e.target.id === 'customerModal') closeCustomerModal();
        });
    </script>
</body>
</html>
